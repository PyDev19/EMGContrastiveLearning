method: bayes
metric:
    name: linear_probe/knn/macro_f1
    goal: maximize
command:
    - ${env}
    - python
    - -m
    - src.train
    - --data-dir
    - /path/to/blueprint_data/both_ungrouped_include_fma_zero
    - --config
    - configs/base.yaml
parameters:
    num_epochs: { value: 60 }
    embeddings_log_freq: { value: 60 }
    linear_probe_freq: { value: 10 }
    learning_rate:
        { distribution: log_uniform_values, min: 1.0e-4, max: 2.0e-3 }
    weight_decay: { values: [0.01, 0.05, 0.1] }
    loss:
        parameters:
            args:
                parameters:
                    temperature: { values: [0.05, 0.07, 0.1, 0.2] }
    model:
        parameters:
            args:
                parameters:
                    num_layers: { values: [2, 4, 6] }
                    drop_path_prob: { values: [0.0, 0.1, 0.2] }
                    pool_drop_prob: { values: [0.0, 0.1] }
